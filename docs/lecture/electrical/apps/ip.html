<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Signal Mechanisms</title>
    <link rel="stylesheet" href="../../../assets/stylesheets/tailwind-course.css">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        /* Mechanism tabs: light lab tabs laid out as full-width cards. */
        .mechanism-btn.lab-tab {
            display: block;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
        }
        .mechanism-btn.lab-tab.is-active {
            box-shadow: inset 4px 0 0 var(--lab-primary);
        }
        canvas {
            background-color: #dbeafe; /* pore water */
            border-radius: 0.5rem;
        }
        /* Toggle Switch CSS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #059669;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #059669;
        }
    </style>
<link rel="stylesheet" href="../../../assets/stylesheets/course-app.css">
</head>
<body class="lab-page min-h-screen">
<div id="course-nav-bar" class="course-nav-bar">
  <a href="../../../">&#8592; Course Home</a>
  <a href="../">Electrical Methods</a>
  <span class="spacer">Environmental Geophysics</span>
</div>


    <!-- Header -->
    <header class="lab-hero">
        <div class="lab-hero-inner">
            <h1 class="lab-title">Two Physical Mechanisms of <span class="lab-title-accent">IP</span></h1>
            <p class="lab-subtitle">Interactive microscopic models of Induced Polarization.</p>
        </div>
    </header>

    <div class="max-w-6xl w-full mx-auto p-6 pb-12">
        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Navigation and Descriptions -->
            <div class="space-y-4 lg:col-span-1 flex flex-col">
                
                <div class="space-y-2">
                    <!-- Mechanism 1 -->
                    <button onclick="switchTab(1)" id="btn-1" class="lab-tab mechanism-btn is-active">
                        <h2 class="text-lg font-bold">1. Membrane Polarization</h2>
                        <p class="text-xs text-slate-600 mt-1">Ion accumulation at pore throats with clay.</p>
                    </button>

                    <!-- Mechanism 2 -->
                    <button onclick="switchTab(2)" id="btn-2" class="lab-tab mechanism-btn">
                        <h2 class="text-lg font-bold">2. Electrode Polarization</h2>
                        <p class="text-xs text-slate-600 mt-1">Charge transfer at metallic mineral surfaces.</p>
                    </button>
                </div>

                <!-- Concept Explanation Card -->
                <div class="lab-card p-5 mt-2 flex-grow overflow-hidden">
                    <h3 class="text-sm font-bold text-slate-800 mb-2 uppercase tracking-wider flex items-center">
                        <svg class="w-4 h-4 mr-2 lab-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        Concept Breakdown
                    </h3>
                    <p id="concept-text" class="text-slate-700 text-sm leading-relaxed mb-4">
                        <!-- Populated by JS -->
                    </p>

                    <!-- Interactive Power Switch -->
                    <div class="border-t border-slate-200 pt-4 mt-auto bg-slate-50 -mx-5 -mb-5 p-5 flex flex-col items-center">
                        <label class="block text-sm font-bold text-slate-700 mb-3 text-center uppercase tracking-widest">Transmitter Current</label>

                        <div class="relative inline-block w-20 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="current-toggle" class="toggle-checkbox absolute block w-10 h-10 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-300 ease-in-out z-10" style="top: -4px; left: 0; transform: translateX(0%); border-color: #cbd5e1;"/>
                            <label for="current-toggle" class="toggle-label touch-label block overflow-visible h-8 rounded-full bg-slate-300 cursor-pointer transition-colors duration-300 ease-in-out"></label>
                        </div>

                        <div class="flex justify-between w-full px-8 mt-2 text-xs font-bold">
                            <span id="label-off" class="text-slate-500">OFF (Decay)</span>
                            <span id="label-on" class="text-slate-500">ON (Charge)</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Right Column: Canvas Animation -->
            <div class="lab-card lg:col-span-2 relative h-[600px] overflow-hidden flex flex-col">

                <!-- Educational overlay text -->
                <div class="absolute top-4 left-4 z-10 pointer-events-none">
                    <h3 id="canvas-title" class="text-2xl font-bold text-slate-900">Membrane Polarization</h3>
                    <p id="canvas-subtitle" class="text-slate-600 text-sm">Dominant in clayey rocks</p>
                </div>

                <!-- Applied Field Indicator (Top Right) -->
                <div id="field-indicator" class="absolute top-24 sm:top-4 right-4 z-10 opacity-0 transition-opacity duration-300 flex items-center space-x-2 bg-violet-50 px-4 py-2 rounded-full border border-violet-300">
                    <span class="text-violet-800 font-bold text-sm">Applied E-Field Active</span>
                    <svg class="w-6 h-6 text-violet-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                </div>

                <canvas id="sim-canvas" class="w-full h-full absolute inset-0"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');
        let currentTab = 1;
        let animationFrameId;
        
        // Physics State
        let isCurrentOn = false;
        let polarizationLevel = 0; // 0 (unpolarized) to 1 (fully polarized)
        let voltageHistory = new Array(100).fill(0); 
        
        let particles = [];
        let electrons = [];

        // UI Event Listeners
        document.getElementById('current-toggle').addEventListener('change', (e) => {
            isCurrentOn = e.target.checked;
            
            const labelOff = document.getElementById('label-off');
            const labelOn = document.getElementById('label-on');
            const toggle = document.getElementById('current-toggle');
            const fieldInd = document.getElementById('field-indicator');
            
            if (isCurrentOn) {
                labelOn.classList.replace('text-slate-500', 'text-emerald-700');
                labelOff.classList.replace('text-red-600', 'text-slate-500');
                toggle.style.transform = 'translateX(100%)';
                toggle.style.borderColor = '#059669';
                fieldInd.classList.remove('opacity-0');
            } else {
                labelOn.classList.replace('text-emerald-700', 'text-slate-500');
                labelOff.classList.replace('text-slate-500', 'text-red-600');
                toggle.style.transform = 'translateX(0%)';
                toggle.style.borderColor = '#dc2626';
                fieldInd.classList.add('opacity-0');
            }
        });

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            initSimulation(currentTab);
        }
        window.addEventListener('resize', resizeCanvas);

        // UI Content Updates
        const mechanisms = [
            { 
                title: "Membrane Polarization", 
                sub: "Dominant in clayey rocks", 
                concept: "<strong>How it works:</strong> Clay surfaces carry a negative charge and attract a cloud of positive ions (cations) into narrow 'pore throats'. The throat therefore passes cations easily but hinders negative ions (anions), like an ion-selective membrane.<br><br><strong>1. Turn ON:</strong> The electric field pushes cations (<span class='text-sky-700 font-bold'>+</span>) to the right, through the throat, and anions (<span class='text-red-600 font-bold'>-</span>) to the left, where the throat blocks them. Because the two kinds of ions cannot cross the throat equally, ions pile up on one side of the throat and are depleted on the other.<br><br><strong>2. Turn OFF:</strong> The concentration difference relaxes by diffusion. This slow recovery produces the decaying voltage (IP effect) we measure."
            },
            { 
                title: "Electrode Polarization", 
                sub: "Dominant in disseminated sulfides, graphite", 
                concept: "<strong>How it works:</strong> Metallic minerals (like sulfide ores) conduct using <em>electrons</em> (<span class='text-yellow-700 font-bold'>e⁻</span>), but groundwater conducts using <em>ions</em> (<span class='text-sky-700 font-bold'>+</span> and <span class='text-red-600 font-bold'>-</span>). <br><br><strong>1. Turn ON:</strong> The electric field forces charges to move. Electrons rush to one side of the metal grain, while ions in the water rush to meet them. This creates a huge charge pile-up (a capacitor) right at the boundary.<br><br><strong>2. Turn OFF:</strong> The external push is gone. The electrons and ions slowly drift away from the boundary, producing the IP decay signal."
            }
        ];

        function switchTab(tabId) {
            currentTab = tabId;
            isCurrentOn = false;
            polarizationLevel = 0;
            voltageHistory.fill(0);
            
            document.getElementById('current-toggle').checked = false;
            document.getElementById('current-toggle').dispatchEvent(new Event('change'));
            
            document.querySelectorAll('.mechanism-btn').forEach(btn => btn.classList.remove('is-active'));
            document.getElementById(`btn-${tabId}`).classList.add('is-active');

            document.getElementById('canvas-title').innerText = mechanisms[tabId-1].title;
            document.getElementById('canvas-subtitle').innerText = mechanisms[tabId-1].sub;
            document.getElementById('concept-text').innerHTML = mechanisms[tabId-1].concept;

            initSimulation(tabId);
        }

        // --- SIMULATION INITIALIZATION ---
        function initSimulation(tabId) {
            particles = [];
            electrons = [];
            const w = canvas.width;
            const h = canvas.height;

            if (tabId === 1) { // Membrane
                // Cations pass the clay-lined throat; anions are held back at its mouth
                for(let i=0; i<70; i++) {
                    let isPositive = i < 44;
                    let baseX = Math.random() * w;
                    // Start anions outside the throat so they begin on one side of it
                    if (!isPositive && baseX > w*0.4 && baseX < w*0.6) baseX = Math.random() < 0.5 ? baseX - w*0.2 : baseX + w*0.2;
                    particles.push({
                        charge: isPositive ? 1 : -1,
                        baseX: baseX,
                        baseY: Math.random() * h,
                        jam: Math.random() * 30,
                        x: 0, y: 0,
                        noiseX: Math.random() * 1000,
                        noiseY: Math.random() * 1000
                    });
                }
            } 
            else if (tabId === 2) { // Electrode
                // Fluid Ions (+ and -)
                for(let i=0; i<60; i++) {
                    let isPositive = Math.random() > 0.5;
                    particles.push({
                        charge: isPositive ? 1 : -1,
                        baseX: Math.random() * w,
                        baseY: Math.random() * h,
                        x: 0, y: 0,
                        noiseX: Math.random() * 1000,
                        noiseY: Math.random() * 1000
                    });
                }
                // Electrons in metal grain
                for(let i=0; i<40; i++) {
                    let r = Math.random() * 60;
                    let theta = Math.random() * 2 * Math.PI;
                    electrons.push({
                        baseX: w/2 + r * Math.cos(theta),
                        baseY: h/2 + r * Math.sin(theta),
                        x: 0, y: 0,
                        noiseX: Math.random() * 1000,
                        noiseY: Math.random() * 1000
                    });
                }
            }
        }

        // --- DRAWING LOOPS ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;
            
            // --- PHYSICS STATE ---
            if (isCurrentOn) {
                polarizationLevel += 0.03; 
                if (polarizationLevel > 1) polarizationLevel = 1;
            } else {
                polarizationLevel -= 0.005; 
                if (polarizationLevel < 0) polarizationLevel = 0;
            }

            let measuredVoltage = (isCurrentOn ? 0.6 : 0) + (polarizationLevel * 0.4);
            voltageHistory.push(measuredVoltage);
            voltageHistory.shift(); 

            // --- BIG E-FIELD WATERMARK ---
            if (polarizationLevel > 0.01) {
                ctx.fillStyle = `rgba(124, 58, 237, ${polarizationLevel * 0.15})`;
                ctx.font = 'bold 80px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // E-field pushes + right, and - left
            ctx.fillText('Applied E-Field →', w/2, h/2 - 120);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            // --- DRAW MICROSCOPIC VIEW ---
            if (currentTab === 1) { // MEMBRANE
                
                // Rock Grains
                ctx.fillStyle = '#e3d3b3';
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(w, 0); ctx.lineTo(w, h/2 - 50);
                ctx.lineTo(w*0.6, h/2 - 50); ctx.lineTo(w*0.5, h/2 - 20); 
                ctx.lineTo(w*0.4, h/2 - 50); ctx.lineTo(0, h/2 - 50);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.lineTo(w, h/2 + 50);
                ctx.lineTo(w*0.6, h/2 + 50); ctx.lineTo(w*0.5, h/2 + 20); 
                ctx.lineTo(w*0.4, h/2 + 50); ctx.lineTo(0, h/2 + 50);
                ctx.fill();

                // Clay Minerals
                ctx.strokeStyle = '#16a34a';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(w*0.45, h/2 - 20); ctx.lineTo(w*0.55, h/2 - 20);
                ctx.moveTo(w*0.45, h/2 + 20); ctx.lineTo(w*0.55, h/2 + 20);
                ctx.stroke();

                ctx.fillStyle = '#166534';
                ctx.font = 'bold 16px Inter, system-ui, sans-serif';
                ctx.fillText('Clay (-)', w*0.5 - 25, h/2 - 30);
                ctx.fillText('Clay (-)', w*0.5 - 25, h/2 + 40);

                // Draw and animate ions
                particles.forEach(p => {
                    p.noiseX += 0.05; p.noiseY += 0.05;
                    let jiggleX = Math.sin(p.noiseX) * 4;
                    let jiggleY = Math.cos(p.noiseY) * 4;

                    let targetX = p.baseX;
                    if (polarizationLevel > 0) {
                        let drift = polarizationLevel * 120;
                        if (p.charge === 1) {
                            // Cations move with E and pass through the throat
                            targetX = p.baseX + drift;
                            if (targetX > w) targetX -= w;
                        } else if (p.baseX > w*0.55) {
                            // Anions move against E and are blocked at the throat mouth
                            targetX = Math.max(w*0.6 + 6 + p.jam, p.baseX - 1.8 * drift);
                        } else {
                            targetX = p.baseX - drift;
                            if (targetX < 0) targetX += w;
                        }
                    }

                    p.x = targetX + jiggleX;
                    p.y = p.baseY + jiggleY;

                    // Constrain to pore
                    let halfGap = 50;
                    // Pore walls narrow linearly from 50 px at 0.4w/0.6w to 20 px at the throat centre
                    if(p.x > w*0.4 && p.x < w*0.6) halfGap = 20 + 30 * Math.abs(p.x - w*0.5) / (w*0.1);
                    p.y = Math.max(h/2 - halfGap + 10, Math.min(h/2 + halfGap - 10, p.y));

                    // Draw the ion with an explicit + or - label
                    ctx.fillStyle = p.charge === 1 ? '#0284c7' : '#dc2626';
                    ctx.beginPath(); ctx.arc(p.x, p.y, 8, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.charge === 1 ? '+' : '-', p.x, p.y);
                });
                
                // Reset alignment
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

                if (polarizationLevel > 0.1) {
                    ctx.fillStyle = '#0369a1';
                    ctx.font = 'bold 14px Inter, system-ui, sans-serif';
                    ctx.globalAlpha = polarizationLevel;
            ctx.fillText('← IONS PILE UP HERE', w*0.62 + 30, h/2 - 10);
                    ctx.globalAlpha = 1.0;
                }

            } 
            else if (currentTab === 2) { // ELECTRODE
                
                let cx = w/2;
                let cy = h/2;
                let r = 90;

                // Draw Metal Grain
                ctx.fillStyle = '#ca8a04'; 
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#a16207'; ctx.lineWidth = 4; ctx.stroke();

                ctx.fillStyle = '#422006';
                ctx.font = 'bold 16px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('METALLIC MINERAL', cx, cy - 25);
                ctx.textAlign = 'left';

                // Electrons inside metal
                electrons.forEach(e => {
                    e.noiseX += 0.1; e.noiseY += 0.1;
                    let jiggleX = Math.sin(e.noiseX) * 3;
                    let jiggleY = Math.cos(e.noiseY) * 3;

                    // Electrons (-) drift LEFT against the E-field
                    let maxDrift = 60;
                    let targetX = e.baseX - (maxDrift * polarizationLevel);
                    
                    let dx = targetX - cx;
                    let dy = e.baseY - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > r - 10) {
                        let angle = Math.atan2(dy, dx);
                        targetX = cx + Math.cos(angle) * (r - 10);
                        e.baseY = cy + Math.sin(angle) * (r - 10);
                    }

                    // Draw Electron with label
                    let renderX = targetX + jiggleX;
                    let renderY = e.baseY + jiggleY;
                    ctx.fillStyle = '#fef08a';
                    ctx.beginPath(); ctx.arc(renderX, renderY, 7, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#854d0e'; ctx.lineWidth = 1; ctx.stroke();

                    ctx.fillStyle = '#713f12';
                    ctx.font = 'bold 10px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('e⁻', renderX, renderY);
                });

                // Fluid Ions outside
                particles.forEach(p => {
                    p.noiseX += 0.05; p.noiseY += 0.05;
                    let jiggleX = Math.sin(p.noiseX) * 4;
                    let jiggleY = Math.cos(p.noiseY) * 4;

                    // Positives (+) drift Right, Negatives (-) drift Left
                    let maxDrift = p.charge === 1 ? 100 : -100;
                    let targetX = p.baseX + (maxDrift * polarizationLevel);
                    
                    let dx = targetX - cx;
                    let dy = p.baseY - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < r + 15) {
                        let angle = Math.atan2(dy, dx);
                        targetX = cx + Math.cos(angle) * (r + 15 + (Math.random()*5));
                        p.baseY = cy + Math.sin(angle) * (r + 15 + (Math.random()*5));
                    }

                    if (targetX > w + 10) targetX = -10;
                    if (targetX < -10) targetX = w + 10;

                    let renderX = targetX + jiggleX;
                    let renderY = p.baseY + jiggleY;

                    // Draw Ion with label
                    ctx.fillStyle = p.charge === 1 ? '#0284c7' : '#dc2626';
                    ctx.beginPath(); ctx.arc(renderX, renderY, 8, 0, Math.PI*2); ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 14px Inter, system-ui, sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(p.charge === 1 ? '+' : '-', renderX, renderY);
                });
                
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; // reset

                // Explanatory text arrows pointing to the pile ups
                if (polarizationLevel > 0.5) {
                    ctx.globalAlpha = polarizationLevel;
                    ctx.fillStyle = '#92400e';
                    ctx.font = 'bold 12px Inter, system-ui, sans-serif';
                    ctx.fillText('Electrons (e⁻) pile up', cx - r - 120, cy - 20);
                    ctx.fillText('to meet positive ions', cx - r - 120, cy - 5);

                    ctx.fillStyle = '#0369a1';
                    ctx.fillText('Positive ions (+)', cx - r - 120, cy + 20);
                    ctx.fillText('attracted to boundary', cx - r - 120, cy + 35);
                    ctx.globalAlpha = 1.0;
                }
            }

            // --- DRAW LIVE OSCILLOSCOPE ---
            drawOscilloscope(w, h);

            animationFrameId = requestAnimationFrame(draw);
        }

        function drawOscilloscope(w, h) {
            let oscW = 280;
            let oscH = 120;
            let oscX = w - oscW - 20;
            let oscY = h - oscH - 20;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(oscX, oscY, oscW, oscH, 8); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#475569';
            ctx.font = '600 10px ui-monospace, "Cascadia Code", Consolas, monospace';
            ctx.fillText('Measured Voltage vs Time', oscX + 10, oscY + 20);

            let zeroY = oscY + oscH - 20;
            let maxV_Y = oscY + 30;
            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath(); ctx.moveTo(oscX + 10, zeroY); ctx.lineTo(oscX + oscW - 10, zeroY); ctx.stroke();
            ctx.strokeStyle = '#e5eaf1';
            ctx.beginPath(); ctx.moveTo(oscX + 10, maxV_Y); ctx.lineTo(oscX + oscW - 10, maxV_Y); ctx.stroke();

            ctx.fillStyle = '#64748b';
            ctx.fillText('0V', oscX + 10, zeroY - 4);
            // Right-aligned so it no longer collides with the panel title.
            ctx.textAlign = 'right';
            ctx.fillText('V(ON)', oscX + oscW - 10, maxV_Y - 4);
            ctx.textAlign = 'left';

            ctx.strokeStyle = '#7c3aed';
            ctx.lineWidth = 3; // thicker line for visibility
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            let graphWidth = oscW - 20;
            let stepX = graphWidth / voltageHistory.length;
            
            for(let i=0; i<voltageHistory.length; i++) {
                let v = voltageHistory[i]; 
                let plotX = oscX + 10 + (i * stepX);
                let plotY = zeroY - (v * (zeroY - maxV_Y));
                
                if (i === 0) ctx.moveTo(plotX, plotY);
                else ctx.lineTo(plotX, plotY);
            }
            ctx.stroke();

            if (!isCurrentOn && polarizationLevel > 0.05) {
                ctx.fillStyle = '#7c3aed';
                ctx.font = 'bold 11px Inter, system-ui, sans-serif';
                ctx.fillText('← IP Decay Tail', oscX + oscW/2, zeroY - (polarizationLevel * (zeroY - maxV_Y)) - 10);
            }
        }

        setTimeout(() => {
            resizeCanvas();
            switchTab(1);
            draw();
        }, 100);
        
    </script>
<script src="../../../assets/javascripts/course-app.js"></script>
</body>
