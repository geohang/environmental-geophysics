    <style>
        /* Light lab theme: page chrome uses the --lab-* tokens from course-app.css;
           scene colors live in the PAL object at the top of the script. */
        :root {
            --text-main: #0f172a;
            --text-muted: #5b6b82;
            --accent-blue: #0369a1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 350px minmax(0, 1fr);
            gap: 24px;
            width: 100%;
            max-width: 80rem;
            min-width: 0;
            margin: 0 auto;
            padding: 24px 1.5rem 40px;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-width: 0;
        }

        .method-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Mode buttons use .lab-tab; setMethod() toggles .is-active together with .active. */
        .method-selector .btn-method {
            gap: 14px;
            padding: 14px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            box-shadow: 0 1px 2px rgb(15 23 42 / .04);
        }

        .btn-method i { font-size: 18px; width: 24px; text-align: center; color: #64748b; }
        .btn-method.is-active i { color: var(--lab-primary); }

        .sidebar .educational-card {
            padding: 20px;
            border-top: 4px solid var(--lab-primary);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .educational-card h3 {
            color: var(--lab-text);
            margin: 0 0 10px 0;
            font-size: 19px;
            font-weight: 700;
        }

        .educational-card p {
            color: var(--lab-text-2);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 16px 0;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .tag {
            background-color: var(--lab-primary-soft);
            border: 1px solid rgb(2 132 199 / .2);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: var(--lab-primary-strong);
        }

        /* --- MAIN VIEW --- */
        .main-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .canvas-container {
            overflow: hidden;
            position: relative;
            flex-grow: 1;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Floating Overlays on Canvas */
        .overlay-panel {
            position: absolute;
            background-color: rgb(255 255 255 / .92);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--lab-border);
            box-shadow: 0 1px 2px rgb(15 23 42 / .06), 0 4px 12px rgb(15 23 42 / .06);
            color: var(--lab-text-2);
        }

        .legend-overlay { top: 20px; right: 20px; }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; flex: 0 0 auto; }

        .scale-overlay {
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .scale-line { width: 2px; height: 60px; border-radius: 1px; background: linear-gradient(to bottom, #cbd5e1, #475569); }
        .scale-text { font-size: 12px; font-weight: 700; color: var(--lab-primary-strong); letter-spacing: .5px; }

        /* Controls Bar */
        .playback-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;

        .control-group {

            gap: 14px;

        .btn-icon {
            background-color: var(--lab-surface-2);
            border: 1px solid var(--lab-border-strong);
            color: var(--lab-text-2);

            display: flex;

            justify-content: center;
            font-size: 16px;
            transition: background-color .15s ease, border-color .15s ease, color .15s ease;
        }
        .btn-icon:hover { background-color: var(--lab-primary); border-color: var(--lab-primary); color: #ffffff; }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--lab-text-2);

        .playback-controls .slider-container input[type=range] { width: 150px; }

        @media (max-width: 1024px) {

            .sidebar { flex-direction: row; flex-wrap: wrap; }
            .method-selector { flex-direction: row; width: 100%; flex-wrap: wrap; }
            .btn-method { flex: 1; min-width: 200px; }
            .canvas-container { min-height: 400px; }

        @media (max-width: 520px) {

            .canvas-container { min-height: 360px; }
            .playback-controls, .control-group, .slider-container { flex-wrap: wrap; }
            .playback-controls { gap: 12px; padding: 14px; }
            .slider-container { width: 100%; min-width: 0; }
            .playback-controls .slider-container input[type="range"] { width: min(100%, 190px); }
        }

    <script>
        // --- LIGHT SCENE PALETTE ---
        // Marks, fields and targets use 600-level tones that read on a light scene; canvas
        // text uses 700/800 tones; the ground warms from light tan to soft orange with depth.
        // Every legend swatch below uses the same PAL entry as the item it labels.
        const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const PAL = {
            skyTop: '#e6f1fa', skyBottom: '#f8fafc',
            oceanTop: '#dbeafe', oceanBottom: '#bfdbfe',
            earthBands: [[0, '#f1e6d1'], [0.22, '#eee0c6'], [0.25, '#e8d5b3'], [0.47, '#e6cfa9'],
                         [0.5, '#eec79d'], [0.72, '#efbd8f'], [0.75, '#f2b07f'], [1, '#f3a472']],
            groundLine: '#b08a5a', seafloor: '#7c9cb8', depthGrid: 'rgba(120, 83, 40, 0.12)',
            ink: '#0f172a', labelBg: 'rgba(255, 255, 255, 0.88)', labelFont: '600 12px ' + FONT,
            hudBg: 'rgba(255, 255, 255, 0.94)', hudLine: '#cbd5e1', hudTitle: '#334155', hudFont: '600 11px ' + FONT,
            source: '#d97706', sourceText: '#92400e',
            fieldLine: 'rgba(51, 65, 85, 0.35)', fieldDot: 'rgba(51, 65, 85, 0.75)',
            red: '#dc2626', redText: '#b91c1c',
            eField: '#0891b2', eText: '#0e7490', hField: '#c026d3', hText: '#a21caf',
            instrument: '#64748b', logger: '#475569', hull: '#475569',
            primary: '#0284c7', primaryText: '#0369a1',
            green: '#059669', greenText: '#047857',
            oil: '#92400e', oilFill: 'rgba(146, 64, 14, 0.3)', oilText: '#78350f',
            ore: '#2563eb', oreText: '#1e40af'
        };

        // --- CONTENT DATA ---
        const methodData = {
            'GMS': {
                title: 'Geomagnetic Sounding',
                desc: 'Uses variations in the Earth\'s natural magnetic field caused by the solar wind. By measuring only the magnetic field (H) at the surface, we sense how electrical conductivity varies hundreds of kilometres down in the mantle, where a hot, conductive upwelling would stand out.',
                tags: ['Natural Source', 'Magnetic Only', 'Depth: 500-2000 km'],
                scaleScale: '1000 km',
                colorTop: PAL.primary, colorAcc: PAL.red,
                legend: [
                    { color: PAL.source, label: 'Solar Wind B-Field' },
                    { color: PAL.fieldDot, label: 'Magnetic Field Lines' },
                    { color: PAL.red, label: 'Conductive Plume' },
                    { color: PAL.eField, label: 'Induced Currents' },
                    { color: PAL.instrument, label: 'Magnetometer' }
                ]
            },
            'MT': {
                title: 'Magnetotellurics (MT)',
                desc: 'Uses natural sources (lightning & solar wind) to induce both Electric (E) and Magnetic (H) fields. The impedance E/H, measured as a function of period, gives apparent resistivity and phase; inverting these gives resistivity versus depth. Excellent for finding geothermal reservoirs.',
                tags: ['Natural Source', 'E & H Fields', 'Depth: 5-100 km'],
                scaleScale: '50 km',
                colorTop: PAL.source, colorAcc: PAL.green,
                legend: [
                    { color: PAL.source, label: 'EM Plane Waves' },
                    { color: PAL.eField, label: 'Electric Field (E)' },
                    { color: PAL.hField, label: 'Magnetic Field (H)' },
                    { color: PAL.red, label: 'Geothermal Fluid' }
                ]
            },
            'CSEM': {
                title: 'Controlled-Source EM',
                desc: 'A ship tows a low-frequency electric dipole transmitter above seafloor receivers. At these frequencies the field is diffusive: a resistive reservoir changes the received amplitude and phase relative to a conductive background. Interpretation requires forward modeling and inversion.',
                tags: ['Active Source', 'Frequency Domain', 'Depth: 1-5 km'],
                scaleScale: '3 km',
                colorTop: PAL.primary, colorAcc: PAL.source,
                legend: [
                    { color: PAL.primary, label: 'Primary Field' },
                    { color: PAL.source, label: 'Reservoir-perturbed Field' },
                    { color: PAL.oil, label: 'Resistive Oil' }
                ]
            },
            'TEM': {
                title: 'Transient EM (Time Domain)',
                desc: 'We pulse a strong current through a ground loop, then turn it off. This abrupt change creates secondary "smoke rings" of current in the earth. Conductive mineral ores prolong this decay: the conductive ore sustains slowly decaying eddy currents, so the late-time signal stays high.',
                tags: ['Active Source', 'Time Domain (Pulsed)', 'Depth: 0-1 km'],
                scaleScale: '1 km',
                colorTop: PAL.green, colorAcc: PAL.red,
                legend: [
                    { color: PAL.red, label: 'Primary Pulse (ON)' },
                    { color: PAL.green, label: 'Secondary Decay (OFF)' },
                    { color: PAL.ore, label: 'Conductive Ore' }
                ]
            }
        };

        // --- GLOBAL VARIABLES ---
        const canvas = document.getElementById('emCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentMethod = 'GMS';
        let animationTime = 0;
        let isPlaying = true;
        let animationFrameId;
        
        const GROUND_LEVEL = 280;
        const SEA_LEVEL = 100;

        // --- GMS: field lines around a good conductor ---
        // The plume is treated as a perfectly conducting cylinder in a uniform vertical field.
        // The time-varying field cannot enter it (B·n = 0 on its surface), so the field lines
        // are the streamlines of potential flow around a cylinder: x'(1 - R²/r²) = c, where
        // x', y' are measured from the plume centre and c is the line's far-field offset.
        const GMS_PLUME = { x: 600, y: 680, r: 200 };
        let gmsLineCache = null;
        function gmsFieldLines() {
            if (gmsLineCache) return gmsLineCache;
            const R = GMS_PLUME.r, R2 = R * R;
            gmsLineCache = [];
            for (let i = 1; i <= 7; i++) {
                const c = (canvas.width / 8) * i - GMS_PLUME.x, sgn = Math.sign(c), ac = Math.abs(c);
                const pts = [];
                for (let y = 80; y <= canvas.height; y += 4) {
                    const yp = y - GMS_PLUME.y, yp2 = yp * yp;
                    let lo = Math.sqrt(Math.max(R2 - yp2, 0)), hi = ac + R; // root lies outside the cylinder
                    for (let n = 0; n < 40; n++) {
                        const u = 0.5 * (lo + hi);
                        if (u * (1 - R2 / (u * u + yp2)) < ac) lo = u; else hi = u;
                    }
                    pts.push([GMS_PLUME.x + sgn * 0.5 * (lo + hi), y]);
                }
                const cum = [0];
                for (let k = 1; k < pts.length; k++) cum.push(cum[k-1] + Math.hypot(pts[k][0] - pts[k-1][0], pts[k][1] - pts[k-1][1]));
                gmsLineCache.push({ pts, cum, len: cum[cum.length - 1] });
            }
            return gmsLineCache;
        }

        // --- MT: 1-D layered-earth example ---
        // Apparent resistivity and phase from the standard impedance recursion for a layered
        // earth; rho_a = |Z|²/(ωμ0). Skin depth δ ≈ 503·sqrt(rho·T) m, here with rho = rho_a(T).
        // The earth section on screen (GROUND_LEVEL to the canvas bottom) spans 0 to 50 km,
        // the depth in the scale box.
        const MT_MODEL = { rho: [100, 5, 1000], h: [5000, 10000] }; // Ω·m; thicknesses in m
        const MT_PERIODS = [0.1, 1, 10, 100, 1000];                 // s, animated in turn
        const MT_PERIOD_TICKS = 240;                                // animation ticks per period
        const MT_SECTION_KM = 50;
        function mt1d(T) {
            const mu0 = 4e-7 * Math.PI, w = 2 * Math.PI / T;
            // complex helpers on [re, im]
            const mul = (a, b) => [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]];
            const div = (a, b) => { const d = b[0]*b[0] + b[1]*b[1]; return [(a[0]*b[0] + a[1]*b[1]) / d, (a[1]*b[0] - a[0]*b[1]) / d]; };
            const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
            const sqrtI = s => { const m = Math.sqrt(s / 2); return [m, m]; };  // sqrt(i·s), s > 0
            const tanh = z => { // tanh(x + iy) = (sinh 2x + i sin 2y) / (cosh 2x + cos 2y)
                const x = Math.min(z[0], 30), d = Math.cosh(2*x) + Math.cos(2*z[1]);
                return [Math.sinh(2*x) / d, Math.sin(2*z[1]) / d];
            };
            const rho = MT_MODEL.rho, h = MT_MODEL.h;
            let Z = sqrtI(w * mu0 * rho[rho.length - 1]);
            for (let j = h.length - 1; j >= 0; j--) {
                const zj = sqrtI(w * mu0 * rho[j]);
                const kh = sqrtI(w * mu0 / rho[j]).map(v => v * h[j]);
                const th = tanh(kh);
                Z = mul(zj, div(add(Z, mul(zj, th)), add(zj, mul(Z, th))));
            }
            const rhoA = (Z[0]*Z[0] + Z[1]*Z[1]) / (w * mu0);
            return { rhoA, phase: Math.atan2(Z[1], Z[0]) * 180 / Math.PI };
        }
        const MT_CURVE = [];
        for (let k = 0; k <= 60; k++) { const T = Math.pow(10, -2 + 6 * k / 60); MT_CURVE.push({ T, ...mt1d(T) }); }
        function mtState(t) {
            const idx = Math.floor(t / MT_PERIOD_TICKS) % MT_PERIODS.length;
            const T = MT_PERIODS[idx], r = mt1d(T);
            const deltaKm = 503 * Math.sqrt(r.rhoA * T) / 1000;
            const pxPerKm = (canvas.height - GROUND_LEVEL) / MT_SECTION_KM;
            return { idx, T, rhoA: r.rhoA, phase: r.phase, deltaKm, deltaPx: deltaKm * pxPerKm };
        }
        const fmtPeriod = T => T < 1 ? T.toFixed(1) : String(T);
        const fmtNum = v => v >= 100 ? v.toFixed(0) : (v >= 10 ? v.toFixed(0) : v.toFixed(1));

        // --- UI LOGIC ---
        function setMethod(method) {
            currentMethod = method;
            animationTime = 0;
            
            // Buttons
            document.querySelectorAll('.btn-method').forEach(btn => btn.classList.remove('active', 'is-active'));
            document.getElementById(`btn-${method}`).classList.add('active', 'is-active');

            // Data Population
            const data = methodData[method];
            document.getElementById('infoTitle').innerText = data.title;
            document.getElementById('infoDesc').innerText = data.desc;
            document.getElementById('infoTags').innerHTML = data.tags.map(t => `<span class="tag">${t}</span>`).join('');
            document.getElementById('scale-bottom').innerText = data.scaleScale;
            
            // Card Theme color
            document.querySelector('.educational-card').style.borderTopColor = data.colorTop;

            // Legend
            document.getElementById('legend').innerHTML = data.legend.map(item => `
                <div class="legend-item">
                    <div class="legend-color" style="background-color: ${item.color}"></div>
                    <span>${item.label}</span>
                </div>
            `).join('');
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playBtn');
            const status = document.getElementById('status-text');
            if (isPlaying) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                status.innerText = 'Playing';
                status.style.color = 'var(--accent-blue)';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
                status.innerText = 'Paused';
                status.style.color = 'var(--text-muted)';
            }
        }

        // --- DRAWING HELPERS ---
        function drawLabel(x, y, text, color = PAL.ink, bgColor = PAL.labelBg) {
            ctx.font = PAL.labelFont;
            ctx.fontWeight = '600';
            const metrics = ctx.measureText(text);
            const padX = 8, padY = 6;
            
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(x - padX, y - 12 - padY, metrics.width + padX*2, 12 + padY*2, 4);
            ctx.fill();
            
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
        }

        function drawBackground() {
            // Sky Gradient
            let sky = ctx.createLinearGradient(0, 0, 0, GROUND_LEVEL);
            sky.addColorStop(0, PAL.skyTop);
            sky.addColorStop(1, PAL.skyBottom);
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, GROUND_LEVEL);

            // Earth Gradient
            let earth = ctx.createLinearGradient(0, GROUND_LEVEL, 0, canvas.height);
            PAL.earthBands.forEach(([stop, color]) => earth.addColorStop(stop, color));

            if(currentMethod === 'CSEM') {
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, canvas.width, SEA_LEVEL);
                
                let ocean = ctx.createLinearGradient(0, SEA_LEVEL, 0, GROUND_LEVEL);
                ocean.addColorStop(0, PAL.oceanTop);
                ocean.addColorStop(1, PAL.oceanBottom);
                ctx.fillStyle = ocean;
                ctx.fillRect(0, SEA_LEVEL, canvas.width, GROUND_LEVEL - SEA_LEVEL);
            }

            ctx.fillStyle = earth;
            ctx.fillRect(0, GROUND_LEVEL, canvas.width, canvas.height - GROUND_LEVEL);
            
            // Surface Crust Line
            ctx.beginPath();
            ctx.moveTo(0, GROUND_LEVEL);
            ctx.lineTo(canvas.width, GROUND_LEVEL);
            ctx.strokeStyle = (currentMethod === 'CSEM') ? PAL.seafloor : PAL.groundLine;
            ctx.lineWidth = 6;
            ctx.stroke();
            
            // Grid lines for depth context
            ctx.strokeStyle = PAL.depthGrid;
            ctx.lineWidth = 1;
            for(let y = GROUND_LEVEL + 50; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        // --- SPECIFIC METHOD ANIMATIONS ---

        function drawGMS(t) {
            // Ionosphere / Solar Wind Band
            let ionosphere = ctx.createLinearGradient(0, 0, 0, 80);
            ionosphere.addColorStop(0, 'rgba(217, 119, 6, 0.22)');
            ionosphere.addColorStop(1, 'rgba(217, 119, 6, 0)');
            ctx.fillStyle = ionosphere;
            ctx.fillRect(0, 0, canvas.width, 80);
            drawLabel(canvas.width/2 - 60, 40, "Solar Wind / Ionosphere", PAL.sourceText, "transparent");

            // Source Waves moving in sky
            ctx.strokeStyle = 'rgba(217, 119, 6, 0.75)';
            ctx.lineWidth = 2;
            for(let i=0; i<3; i++) {
                ctx.beginPath();
                for(let x=0; x<canvas.width; x+=20) {
                    let y = 30 + i*20 + Math.sin(x*0.02 - t*0.05)*10;
                    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
                }
                ctx.stroke();
            }

            // Target: Mantle Plume (a good conductor of radius GMS_PLUME.r)
            const plumeX = GMS_PLUME.x, plumeY = GMS_PLUME.y;
            let plumeGrad = ctx.createRadialGradient(plumeX, plumeY, 20, plumeX, plumeY, GMS_PLUME.r + 10);
            plumeGrad.addColorStop(0, 'rgba(220, 38, 38, 0.8)'); // Red core
            plumeGrad.addColorStop(0.55, 'rgba(234, 88, 12, 0.35)');
            plumeGrad.addColorStop(1, 'rgba(234, 88, 12, 0)');
            ctx.fillStyle = plumeGrad;
            ctx.beginPath(); ctx.arc(plumeX, plumeY, GMS_PLUME.r + 10, 0, Math.PI*2); ctx.fill();

            // Induced current loops inside the plume. They flow so that their own field opposes
            // the change of the source field, so they reverse when dB/dt (inset) changes sign
            // and are strongest when the field changes fastest.
            const dBdt = Math.cos(t*0.05);            // derivative of the inset's sin(0.05 t)
            const dir = dBdt >= 0 ? -1 : 1;           // circulation sense on the front of each loop
            ctx.strokeStyle = PAL.eField; ctx.fillStyle = PAL.eField;
            ctx.globalAlpha = 0.3 + 0.7 * Math.abs(dBdt);
            ctx.lineWidth = 2.5;
            [[505, 62, 9], [577, 140, 14]].forEach(([ly, rx, ry]) => {
                ctx.beginPath(); ctx.ellipse(plumeX, ly, rx, ry, 0, 0, Math.PI*2); ctx.stroke();
                [-0.45, 0.45].forEach(f => {          // arrowheads on the near side of the loop
                    const ax = plumeX + f*rx, ay = ly + ry*Math.sqrt(1 - f*f);
                    ctx.beginPath(); ctx.moveTo(ax + dir*8, ay); ctx.lineTo(ax - dir*4, ay - 5); ctx.lineTo(ax - dir*4, ay + 5); ctx.closePath(); ctx.fill();
                });
            });
            ctx.globalAlpha = 1;
            drawLabel(plumeX - 40, canvas.height - 50, "Hot Mantle Plume", PAL.redText);

            // Magnetic field lines (B). Induced currents in the good conductor oppose the changing
            // field, so the field is excluded from the plume and the lines bend around it.
            ctx.strokeStyle = PAL.fieldLine;
            ctx.lineWidth = 3;
            gmsFieldLines().forEach((line, i) => {
                ctx.beginPath();
                line.pts.forEach(([x, y], k) => { if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
                ctx.stroke();

                // Moving dots, spaced along the line by arc length
                const s = (((t*0.5 + (i+1)*20) % 100) / 100) * line.len;
                let k = 1; while (k < line.cum.length - 1 && line.cum[k] < s) k++;
                const f = (s - line.cum[k-1]) / Math.max(1e-6, line.cum[k] - line.cum[k-1]);
                const dotX = line.pts[k-1][0] + (line.pts[k][0] - line.pts[k-1][0]) * f;
                const dotY = line.pts[k-1][1] + (line.pts[k][1] - line.pts[k-1][1]) * f;
                ctx.fillStyle = PAL.fieldDot;
                ctx.beginPath(); ctx.arc(dotX, dotY, 3, 0, Math.PI*2); ctx.fill();
            });

            // Surface Magnetometer (Rx)
            ctx.fillStyle = PAL.instrument;
            ctx.fillRect(canvas.width/2 - 15, GROUND_LEVEL - 20, 30, 20);
            ctx.fillStyle = PAL.red; // blinking light
            if(Math.floor(t/10) % 2 === 0) ctx.fillRect(canvas.width/2 - 3, GROUND_LEVEL - 25, 6, 5);
            drawLabel(canvas.width/2 - 45, GROUND_LEVEL - 35, "Magnetometer (Rx)", PAL.ink);

            // --- HUD GRAPHIC FOR GMS OBSERVATION ---
            drawGMSGraph(t);
        }

        function drawMT(t) {
            // Source: Lightning & Plane Waves
            if (t % 120 < 10) {
                // Lightning flash
                ctx.strokeStyle = PAL.source;
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(170, 50); ctx.lineTo(140, 90); ctx.lineTo(180, GROUND_LEVEL); ctx.stroke();
                
                // Flash glow
                ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
                ctx.fillRect(0,0, canvas.width, GROUND_LEVEL);
            }

            // Plane waves descending. In the conductive earth the amplitude decays as exp(-z/δ),
            // drawn as line opacity; δ grows with period, so long periods reach deeper.
            const mt = mtState(t);
            const fade = y => Math.exp(-(y - GROUND_LEVEL) / mt.deltaPx);
            ctx.lineWidth = 2;
            let waveGap = 80;
            let waveSpeed = 1.5;
            for(let yOffset = 0; yOffset < canvas.height; yOffset += waveGap) {
                let y = ((t * waveSpeed) + yOffset) % canvas.height;
                if(y > GROUND_LEVEL) {
                    ctx.strokeStyle = `rgba(217, 119, 6, ${(0.6 * fade(y)).toFixed(3)})`; // Orangeish
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }

            // Skin-depth marker for the period now animated
            ctx.save();
            ctx.strokeStyle = PAL.sourceText; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
            const dY = GROUND_LEVEL + mt.deltaPx;
            const inView = dY < canvas.height - 8;
            const dText = `fades over one skin depth δ ≈ ${fmtNum(mt.deltaKm)} km` + (inView ? ` (T = ${fmtPeriod(mt.T)} s)` : ', below this view');
            ctx.font = PAL.labelFont;
            const dX = canvas.width - 24 - ctx.measureText(dText).width;
            if (inView) { ctx.beginPath(); ctx.moveTo(dX - 10, dY); ctx.lineTo(canvas.width, dY); ctx.stroke(); }
            ctx.restore();
            drawLabel(dX, inView ? Math.max(dY - 8, GROUND_LEVEL + 22) : canvas.height - 14, dText, PAL.sourceText);

            // Target: Geothermal Fault (Conductive)
            let faultX = canvas.width/2 + 80;
            ctx.fillStyle = 'rgba(220, 38, 38, 0.28)'; // Reddish fluid
            ctx.beginPath();
            ctx.moveTo(faultX, GROUND_LEVEL + 50);
            ctx.lineTo(faultX + 40, canvas.height);
            ctx.lineTo(faultX - 20, canvas.height);
            ctx.fill();
            
            // Draw fracture lines
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.9)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(faultX, GROUND_LEVEL+50); ctx.lineTo(faultX+20, GROUND_LEVEL+150); ctx.lineTo(faultX, GROUND_LEVEL+200); ctx.stroke();
            drawLabel(faultX + 30, GROUND_LEVEL + 150, "Hot Geothermal Fluids", PAL.redText);

            // Propagating E and H fields
            let fieldY = GROUND_LEVEL + ((t * 1.5) % (canvas.height - GROUND_LEVEL));
            const amp = fade(fieldY); // E and H shrink and fade with depth, exp(-z/δ)
            if(fieldY > GROUND_LEVEL + 20 && amp > 0.03) {
                ctx.globalAlpha = Math.min(1, 0.25 + amp);
                // E Field (Horizontal - Cyan)
                ctx.strokeStyle = PAL.eField; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(canvas.width/3 - 40*amp, fieldY); ctx.lineTo(canvas.width/3 + 40*amp, fieldY); ctx.stroke();
                ctx.fillStyle = PAL.eText; ctx.fillText("E-Field", canvas.width/3 + 40*amp + 5, fieldY + 4);

                // H Field (Diagonal simulating into-page - Magenta)
                ctx.strokeStyle = PAL.hField;
                ctx.beginPath(); ctx.moveTo(canvas.width/3, fieldY); ctx.lineTo(canvas.width/3 - 25*amp, fieldY - 20*amp); ctx.stroke();
                ctx.fillStyle = PAL.hText; ctx.fillText("H-Field", canvas.width/3 - 25*amp - 40, fieldY - 20*amp - 5);
                ctx.globalAlpha = 1;
            }

            // Current concentration in fault
            let currentPulse = Math.sin(t*0.1)*0.5 + 0.5;
            ctx.fillStyle = `rgba(8, 145, 178, ${currentPulse * 0.35})`;
            ctx.beginPath(); ctx.arc(faultX + 10, canvas.height - 100, 30 + currentPulse*10, 0, Math.PI*2); ctx.fill();

            // Sensors (Electric Dipole + Magnetic Coil)
            // Wires
            ctx.strokeStyle = PAL.instrument; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(canvas.width/2 - 80, GROUND_LEVEL - 5); ctx.lineTo(canvas.width/2 + 80, GROUND_LEVEL - 5); ctx.stroke();
            // Electrodes
            ctx.fillStyle = PAL.source;
            ctx.fillRect(canvas.width/2 - 85, GROUND_LEVEL - 15, 10, 15);
            ctx.fillRect(canvas.width/2 + 75, GROUND_LEVEL - 15, 10, 15);
            // Logger
            ctx.fillStyle = PAL.logger; ctx.fillRect(canvas.width/2 - 15, GROUND_LEVEL - 20, 30, 20);
            drawLabel(canvas.width/2 - 40, GROUND_LEVEL - 30, "MT Station (Ex, Ey, Hx, Hy)", PAL.ink);

            // --- HUD GRAPHIC FOR MT OBSERVATION ---
            drawMTGraph(t, mt);
        }

        function drawCSEM(t) {
            // Target: Oil Reservoir (Resistive)
            let resX = canvas.width/2 + 150;
            let resY = GROUND_LEVEL + 180;
            ctx.fillStyle = PAL.oilFill; // Oil
            ctx.strokeStyle = PAL.oil;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.ellipse(resX, resY, 160, 50, 0, 0, 2 * Math.PI);
            ctx.fill(); ctx.stroke();
            
            // Texture inside reservoir
            ctx.strokeStyle = 'rgba(146, 64, 14, 0.25)';
            for(let i=-120; i<120; i+=20) {
                ctx.beginPath(); ctx.moveTo(resX+i, resY-30); ctx.lineTo(resX+i, resY+30); ctx.stroke();
            }
            drawLabel(resX - 40, resY + 5, "Resistive Oil Reservoir", PAL.oilText);

            // Survey Ship
            let shipX = (t * 0.8) % (canvas.width + 300) - 100;
            
            ctx.fillStyle = PAL.hull;
            ctx.beginPath();
            ctx.moveTo(shipX - 60, SEA_LEVEL);
            ctx.lineTo(shipX + 70, SEA_LEVEL); // Bow
            ctx.lineTo(shipX + 40, SEA_LEVEL + 25); // Hull bottom
            ctx.lineTo(shipX - 50, SEA_LEVEL + 25);
            ctx.fill();
            // Superstructure
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(shipX - 30, SEA_LEVEL - 30, 40, 30);
            ctx.fillRect(shipX - 10, SEA_LEVEL - 50, 10, 20);
            drawLabel(shipX - 30, SEA_LEVEL - 60, "Survey Vessel", PAL.ink);

            // Tow Cable & Transmitter
            let txX = shipX - 180;
            let txY = GROUND_LEVEL - 30; // Deep tow
            ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(shipX - 50, SEA_LEVEL); ctx.lineTo(txX, txY); ctx.stroke();
            
            // Transmitter Body
            ctx.fillStyle = PAL.primary; // Tx body, flat fill (no glow)
            ctx.fillRect(txX - 30, txY - 8, 60, 16);
            ctx.shadowBlur = 0; // reset
            drawLabel(txX - 40, txY - 20, "Transmitter (Tx)", PAL.primaryText);

            // Seafloor Receivers
            ctx.fillStyle = PAL.green;
            for(let i=0; i<4; i++) {
                let rxX = 350 + i*140;
                ctx.fillRect(rxX, GROUND_LEVEL - 15, 20, 15);
                if(i===2) drawLabel(rxX - 30, GROUND_LEVEL - 25, "Receivers (Rx)", PAL.greenText);
            }

            // Continuous EM Wave Propagation
            ctx.globalCompositeOperation = 'source-over';
            for(let i=0; i<6; i++) {
                let radius = ((t * 2.5) + i * 50) % 400;
                
                if (radius > 10) {
                    // Primary descending wave
                    ctx.strokeStyle = `rgba(2, 132, 199, ${1 - radius/400})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(txX, txY, radius, 0, Math.PI); ctx.stroke();

                    // Refraction/Guiding along the resistive reservoir
                    if (radius > 150) {
                        let hitDist = Math.abs((txX + radius) - (resX - 100));
                        if(hitDist < 150) {
                            // Secondary returning wave (guided by reservoir)
                            ctx.strokeStyle = `rgba(217, 119, 6, ${1 - radius/400})`;
                            ctx.beginPath(); 
                            ctx.arc(resX, resY, radius/2, Math.PI, 2*Math.PI); 
                            ctx.stroke();
                        }
                    }
                }
            }
            ctx.globalCompositeOperation = 'source-over';

            // --- HUD GRAPHIC FOR CSEM OBSERVATION ---
            drawCSEMGraph(t, shipX, resX);
        }

        function drawTEM(t) {
            // Target: Conductive Massive Sulfide Ore
            let oreX = canvas.width/2 + 60;
            let oreY = GROUND_LEVEL + 160;
            ctx.fillStyle = PAL.ore; // Conductive ore, drawn in its legend color
            ctx.beginPath();
            ctx.moveTo(oreX, oreY - 40); ctx.lineTo(oreX + 120, oreY - 20);
            ctx.lineTo(oreX + 80, oreY + 80); ctx.lineTo(oreX - 20, oreY + 60);
            ctx.fill();
            drawLabel(oreX - 20, oreY + 100, "Highly Conductive Ore (Ni/Cu)", PAL.oreText); // below the ore, clear of the eddy-current label

            // Source Loop (Tx) on ground
            ctx.strokeStyle = PAL.red; // Red loop
            ctx.lineWidth = 6;
            ctx.beginPath();
            // Isometric ellipse for loop
            ctx.ellipse(canvas.width/2 - 100, GROUND_LEVEL, 120, 20, 0, 0, 2*Math.PI);
            ctx.stroke();
            drawLabel(canvas.width/2 - 250, GROUND_LEVEL - 10, "Tx Loop", PAL.redText);

            // Receiver Coil (Rx) inside loop
            ctx.fillStyle = PAL.primary;
            ctx.fillRect(canvas.width/2 - 110, GROUND_LEVEL - 15, 20, 15);
            drawLabel(canvas.width/2 - 110, GROUND_LEVEL - 25, "Rx", PAL.primaryText, "transparent");

            // Timing logic
            let cycleLength = 300;
            let cycle = t % cycleLength;
            let pulseDuration = 80;
            let isPulseOn = cycle < pulseDuration;

            // --- HUD GRAPHIC FOR TEM TIMING ---
            drawTEMGraph(cycle, cycleLength, pulseDuration);

            if (isPulseOn) {
                // STATE 1: CURRENT ON (Building Primary Field)
                let buildUp = cycle / pulseDuration;
                ctx.strokeStyle = `rgba(220, 38, 38, ${0.3 + buildUp*0.5})`; // Reddish primary field
                ctx.lineWidth = 4;
                for(let i=1; i<=4; i++) {
                    ctx.beginPath();
                    ctx.ellipse(canvas.width/2 - 100, GROUND_LEVEL, (80 + i*40)*buildUp, (40 + i*60)*buildUp, 0, 0, Math.PI);
                    ctx.stroke();
                }
                
                // Visual Indicator
                drawLabel(canvas.width/2 - 150, GROUND_LEVEL + 50, "STATE: Primary Field Charging", '#991b1b', 'rgba(254, 226, 226, 0.92)');
            } else {
                // STATE 2: CURRENT OFF (Secondary field decay)
                let decayTime = cycle - pulseDuration;
                let maxDecay = cycleLength - pulseDuration;
                
                // Expanding, descending "Smoke Rings"
                let ringDepth = GROUND_LEVEL + decayTime * 2;
                let ringWidth = 240 + decayTime * 1.5;
                
                let alpha = 1 - (decayTime / maxDecay);
                ctx.strokeStyle = `rgba(5, 150, 105, ${alpha})`; // Greenish secondary
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.ellipse(canvas.width/2 - 100, ringDepth, ringWidth/2, 30 + decayTime/4, 0, 0, 2*Math.PI);
                ctx.stroke();

                // Interaction with ore body: once the diffusing currents reach the ore, the good
                // conductor sustains its own eddy currents, which decay much more slowly than the
                // host currents (no reflection involved), so the late-time signal stays high.
                const hitTime = (oreY - 40 - GROUND_LEVEL) / 2; // decayTime when the ring reaches the ore
                if (decayTime >= hitTime) {
                    const oreAlpha = Math.exp(-(decayTime - hitTime) / 150);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${(0.9 * oreAlpha).toFixed(3)})`;
                    ctx.lineWidth = 2.5;
                    [[40, 14], [20, 7]].forEach(([rx, ry]) => {
                        ctx.beginPath(); ctx.ellipse(oreX + 47, oreY + 22, rx, ry, 0, 0, 2*Math.PI); ctx.stroke();
                    });

                    // Secondary field from the ore eddy currents reaching the surface Rx
                    ctx.strokeStyle = `rgba(5, 150, 105, ${oreAlpha.toFixed(3)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(oreX + 40, oreY - 30); ctx.lineTo(canvas.width/2 - 100, GROUND_LEVEL); ctx.stroke();
                    drawLabel(oreX + 130, oreY - 20, "Ore eddy currents (slow decay)", PAL.greenText);
                }

                drawLabel(canvas.width/2 - 150, GROUND_LEVEL + 50, "STATE: Listening to Decay", '#065f46', 'rgba(209, 250, 229, 0.92)');
            }
        }

        function drawGMSGraph(t) {
            let gX = 30, gY = canvas.height - 150, gW = 220, gH = 80;
            
            // Background
            ctx.fillStyle = PAL.hudBg;
            ctx.beginPath(); ctx.roundRect(gX, gY, gW + 20, gH + 40, 8);
            ctx.fill();
            ctx.strokeStyle = PAL.hudLine; ctx.stroke();

            // Label
            ctx.fillStyle = PAL.hudTitle; ctx.font = PAL.hudFont;
            ctx.fillText("Observed Magnetic Field (Bz)", gX + 10, gY + 20);

            // Axes
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+gW, gY+gH+10); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+10, gY+30); ctx.stroke(); // Y

            // Plot scrolling sine wave
            ctx.strokeStyle = PAL.source; ctx.lineWidth = 2;
            ctx.beginPath();
            for(let i=0; i<gW-20; i++) {
                let historyT = t - (gW - 20 - i);
                let val = Math.sin(historyT*0.05) * 20;
                let plotX = gX + 10 + i;
                let plotY = gY + 60 + val;
                if(i===0) ctx.moveTo(plotX, plotY); else ctx.lineTo(plotX, plotY);
            }
            ctx.stroke();
            
            // Current value dot
            ctx.fillStyle = PAL.red;
            ctx.beginPath(); ctx.arc(gX + gW - 10, gY + 60 + Math.sin(t*0.05)*20, 4, 0, Math.PI*2); ctx.fill();
        }

        function drawMTGraph(t, mt) {
            // Left: E and H time series at the station for the period now animated (amplitudes
            // normalized; E leads H by the model phase). Right: apparent resistivity is a function
            // of period, so it is a fixed curve; the marker shows the period now animated.
            const gX = 30, gY = canvas.height - 162, boxW = 470, boxH = 150;

            ctx.fillStyle = PAL.hudBg;
            ctx.beginPath(); ctx.roundRect(gX, gY, boxW, boxH, 8);
            ctx.fill();
            ctx.strokeStyle = PAL.hudLine; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = PAL.hudTitle; ctx.font = PAL.hudFont;
            ctx.fillText("E & H at the station (normalized)", gX + 10, gY + 18);
            ctx.fillText("Apparent resistivity vs period", gX + 250, gY + 18);

            // --- time series ---
            const tsX0 = gX + 10, tsW = 200, tsY = gY + 62;
            ctx.strokeStyle = PAL.hudLine;
            ctx.beginPath(); ctx.moveTo(tsX0, gY + 100); ctx.lineTo(tsX0 + tsW, gY + 100); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(tsX0, gY + 100); ctx.lineTo(tsX0, gY + 26); ctx.stroke();        // Y
            const wVis = 0.2 / Math.pow(1.7, mt.idx);   // longer period, slower oscillation
            const ph = mt.phase * Math.PI / 180;
            ctx.lineWidth = 2;
            [[PAL.eField, 0, -8], [PAL.hField, ph, 8]].forEach(([col, lag, off]) => {
                ctx.beginPath(); ctx.strokeStyle = col;
                for (let i = 0; i < tsW; i++) {
                    const val = Math.sin((t - (tsW - i)) * wVis - lag) * 14;
                    if (i === 0) ctx.moveTo(tsX0 + i, tsY + off + val); else ctx.lineTo(tsX0 + i, tsY + off + val);
                }
                ctx.stroke();
            });
            ctx.font = '600 10px ' + FONT;
            ctx.fillStyle = PAL.eText; ctx.fillText("E", tsX0 + tsW + 4, tsY - 6);
            ctx.fillStyle = PAL.hText; ctx.fillText("H", tsX0 + tsW + 4, tsY + 12);
            ctx.fillStyle = PAL.hudTitle; ctx.fillText("time", tsX0 + tsW / 2 - 10, gY + 112);

            // --- rho_a(T) on log axes ---
            const px0 = gX + 290, px1 = gX + boxW - 14, py0 = gY + 28, py1 = gY + 98;
            const lx = T => px0 + (px1 - px0) * (Math.log10(T) + 2) / 6;       // 0.01 to 10^4 s
            const ly = r => py1 - (py1 - py0) * Math.log10(r) / 3;             // 1 to 1000 Ω·m
            ctx.strokeStyle = '#e5eaf1'; ctx.lineWidth = 1;
            for (let d = -2; d <= 4; d += 2) { const x = lx(Math.pow(10, d)); ctx.beginPath(); ctx.moveTo(x, py0); ctx.lineTo(x, py1); ctx.stroke(); }
            for (let d = 0; d <= 3; d++) { const y = ly(Math.pow(10, d)); ctx.beginPath(); ctx.moveTo(px0, y); ctx.lineTo(px1, y); ctx.stroke(); }
            ctx.strokeStyle = PAL.hudLine; ctx.strokeRect(px0, py0, px1 - px0, py1 - py0);
            ctx.fillStyle = '#64748b'; ctx.font = '600 10px ' + FONT;
            ctx.textAlign = 'right';
            ['1', '10', '100', '1000'].forEach((s, d) => ctx.fillText(s, px0 - 4, ly(Math.pow(10, d)) + 3));
            ctx.textAlign = 'center';
            [['0.01', -2], ['1', 0], ['100', 2], ['10⁴', 4]].forEach(([s, d]) => ctx.fillText(s, lx(Math.pow(10, d)), py1 + 12));
            ctx.fillStyle = PAL.hudTitle;
            ctx.fillText('Period T (s)', (px0 + px1) / 2, py1 + 24);
            ctx.textAlign = 'left';
            ctx.save(); ctx.translate(gX + 256, (py0 + py1) / 2 + 22); ctx.rotate(-Math.PI / 2); ctx.fillText('ρa (Ω·m)', 0, 0); ctx.restore();
            ctx.strokeStyle = PAL.green; ctx.lineWidth = 2;
            ctx.beginPath();
            MT_CURVE.forEach((p, k) => { if (k === 0) ctx.moveTo(lx(p.T), ly(p.rhoA)); else ctx.lineTo(lx(p.T), ly(p.rhoA)); });
            ctx.stroke();
            ctx.fillStyle = PAL.red;
            ctx.beginPath(); ctx.arc(lx(mt.T), ly(mt.rhoA), 5, 0, Math.PI * 2); ctx.fill();

            // Readout: changes only when the animated period changes
            ctx.fillStyle = PAL.greenText; ctx.font = 'bold 11px ' + FONT;
            ctx.fillText(`T = ${fmtPeriod(mt.T)} s   ρa ≈ ${fmtNum(mt.rhoA)} Ω·m   phase ≈ ${mt.phase.toFixed(0)}°`, gX + 10, gY + 132);
            ctx.font = '600 10px ' + FONT; ctx.fillStyle = PAL.hudTitle;
            ctx.fillText('Layered-earth example: 100 Ω·m over a 5 Ω·m layer (5 to 15 km) over 1000 Ω·m', gX + 10, gY + 145);
        }

        function drawCSEMGraph(t, shipX, resX) {
            let gX = 30, gY = canvas.height - 150, gW = 220, gH = 80;
            
            ctx.fillStyle = PAL.hudBg;
            ctx.beginPath(); ctx.roundRect(gX, gY, gW + 20, gH + 40, 8);
            ctx.fill();
            ctx.strokeStyle = PAL.hudLine; ctx.stroke();

            ctx.fillStyle = PAL.hudTitle; ctx.font = PAL.hudFont;
            ctx.fillText("Magnitude vs Offset (MVO)", gX + 10, gY + 20);

            // Axes
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+gW, gY+gH+10); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+10, gY+30); ctx.stroke(); // Y
            
            // Labels
            ctx.fillStyle = PAL.hudTitle; ctx.font = '600 10px ' + FONT;
            ctx.fillText("Offset (Ship Pos)", gX + gW/2 - 20, gY + gH + 25);
            ctx.save(); ctx.translate(gX-5, gY+gH/2+20); ctx.rotate(-Math.PI/2); ctx.fillText("Amplitude", 0, 0); ctx.restore();

            // Baseline curve (exponential decay)
            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<gW-20; x++) {
                let y = gY + 35 + (x*x)/500; // quadratic/exp decay shape
                if(y > gY+gH+10) y = gY+gH+10;
                if(x===0) ctx.moveTo(gX+10+x, y); else ctx.lineTo(gX+10+x, y);
            }
            ctx.stroke();

            // Anomaly curve
            ctx.strokeStyle = PAL.source; ctx.lineWidth = 2;
            ctx.beginPath();
            // Map reservoir position to graph width
            let anomalyCenterPoint = (resX / canvas.width) * (gW - 20); 
            for(let x=0; x<gW-20; x++) {
                let base_y = 35 + (x*x)/500;
                let anomaly = Math.exp(-Math.pow(x - anomalyCenterPoint, 2) / 400) * 20; 
                let y = gY + base_y - anomaly;
                if(y > gY+gH+10) y = gY+gH+10;
                if(x===0) ctx.moveTo(gX+10+x, y); else ctx.lineTo(gX+10+x, y);
            }
            ctx.stroke();

            // Moving dot representing ship
            let shipProgress = shipX / canvas.width;
            let dotX = gX + 10 + shipProgress * (gW - 20);
            if (dotX >= gX + 10 && dotX <= gX + gW - 10) {
                let xMapped = dotX - (gX + 10);
                let base_y = 35 + (xMapped*xMapped)/500;
                let anomaly = Math.exp(-Math.pow(xMapped - anomalyCenterPoint, 2) / 400) * 20;
                let dotY = gY + base_y - anomaly;
                if(dotY > gY+gH+10) dotY = gY+gH+10;

                ctx.fillStyle = PAL.primary;
                ctx.beginPath(); ctx.arc(dotX, dotY, 4, 0, Math.PI*2); ctx.fill();
            }
        }

        function drawTEMGraph(cycle, cycleLength, pulseDuration) {
            let gX = 30, gY = canvas.height - 150, gW = 220, gH = 80;

            // Background
            ctx.fillStyle = PAL.hudBg;
            ctx.beginPath(); ctx.roundRect(gX, gY, gW + 20, gH + 40, 8);
            ctx.fill();
            ctx.strokeStyle = PAL.hudLine; ctx.stroke();

            // Label
            ctx.fillStyle = PAL.hudTitle; ctx.font = PAL.hudFont;
            ctx.fillText("TEM Observations", gX + 10, gY + 20);

            // Axes
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+gW, gY+gH+10); ctx.stroke(); // X
            ctx.beginPath(); ctx.moveTo(gX+10, gY+gH+10); ctx.lineTo(gX+10, gY+30); ctx.stroke(); // Y
            
            // Legend
            ctx.fillStyle = PAL.red; ctx.fillText("Tx (I)", gX + 140, gY + 20);
            ctx.fillStyle = PAL.greenText; ctx.fillText("Rx (dB/dt)", gX + 180, gY + 20);

            // The waveform (Square pulse)
            let pulseW = (pulseDuration / cycleLength) * (gW - 20);
            
            // 1. Draw Tx Current (I)
            ctx.strokeStyle = 'rgba(220, 38, 38, 0.7)'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(gX+10, gY+gH+5); // Start 0
            ctx.lineTo(gX+10, gY+40); // Up
            ctx.lineTo(gX+10+pulseW, gY+40); // Across (ON)
            ctx.lineTo(gX+10+pulseW, gY+gH+5); // Down
            ctx.lineTo(gX+gW, gY+gH+5); // Across (OFF)
            ctx.stroke();

            // 2. Draw Rx Voltage (dB/dt)
            ctx.strokeStyle = PAL.green; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(gX+10, gY+gH+10);
            ctx.lineTo(gX+10+pulseW, gY+gH+10); // 0 during ON time
            ctx.lineTo(gX+10+pulseW, gY+gH+30); // Spike down
            for(let x=10+pulseW; x<gW; x+=2) {
                let decay_t = x - (10+pulseW);
                // Secondary decay
                let decay_val = Math.exp(-decay_t / 15) * 20;
                ctx.lineTo(gX+x, gY+gH+10 + decay_val);
            }
            ctx.stroke();

            // Progress dot/line
            let progressX = gX + 10 + (cycle / cycleLength) * (gW - 20);
            ctx.strokeStyle = '#475569';
            ctx.setLineDash([2, 2]);
            ctx.beginPath(); ctx.moveTo(progressX, gY+30); ctx.lineTo(progressX, gY+gH+15); ctx.stroke();
            ctx.setLineDash([]);
        }

        // --- RENDER LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();

            switch(currentMethod) {
                case 'GMS': drawGMS(animationTime); break;
                case 'MT': drawMT(animationTime); break;
                case 'CSEM': drawCSEM(animationTime); break;
                case 'TEM': drawTEM(animationTime); break;
            }

            if (isPlaying) {
                let speed = parseFloat(document.getElementById('speedSlider').value);
                animationTime += (1 * speed);
            }
            
            animationFrameId = requestAnimationFrame(animate);
        }

        // Initialize
        setMethod('GMS');
        animate();

    </script>
